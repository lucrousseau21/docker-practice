questions:
  - uuid: 7f9a3e2c-8d1b-5e4a-6f9c-3d7a2e8b4f1c
    question: What command is used to create a Docker secret in Swarm mode?
    answers:
      - { value: 'docker secret add', correct: false }
      - { value: 'docker secret create', correct: true }
      - { value: 'docker swarm secret', correct: false }
      - { value: 'docker create secret', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/secret_create/

  - uuid: 2e8a4f9c-7d1b-5e3a-9f6c-4d7a3e8b2f1c
    question: Where are Docker secrets stored in a Swarm cluster?
    answers:
      - { value: 'On worker nodes only', correct: false }
      - { value: 'In the Raft log on manager nodes, encrypted at rest', correct: true }
      - { value: 'In environment variables', correct: false }
      - { value: 'In the Docker registry', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 5c9e8a4f-7d2b-1e3a-6f9c-3d8a5e7b2f4c
    question: How are secrets made available to containers?
    answers:
      - { value: 'As environment variables', correct: false }
      - { value: 'As in-memory files mounted at /run/secrets/', correct: true }
      - { value: 'In the container image', correct: false }
      - { value: 'In /etc/docker/secrets/', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 1d7a4f9e-8c2b-5e3a-9f6c-2d8a4e7b3f1c
    question: Can Docker secrets be used with standalone containers (non-Swarm)?
    answers:
      - { value: 'Yes, with any container', correct: false }
      - { value: 'No, secrets require Swarm mode', correct: true }
      - { value: 'Only on Linux', correct: false }
      - { value: 'Only with Docker Compose', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 6f3a9e2c-7d1b-4e8a-5f9c-3d7a2e8b1f4c
    question: What is the maximum size of a Docker secret?
    answers:
      - { value: '256 KB', correct: false }
      - { value: '500 KB', correct: true }
      - { value: '1 MB', correct: false }
      - { value: 'Unlimited', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 9e8a7f4c-8d1b-5e3a-6f9c-4d7a3e8b2f1c
    question: How do you grant a service access to a secret?
    answers:
      - { value: 'Secrets are automatically available to all services', correct: false }
      - { value: 'Use the --secret flag when creating or updating the service', correct: true }
      - { value: 'Mount the secret as a volume', correct: false }
      - { value: 'Set it as an environment variable', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 3c4a9e8f-7d2b-5e1a-9f6c-2d8a5e7b3f4c
    question: Can you update an existing Docker secret?
    answers:
      - { value: 'Yes, using docker secret update', correct: false }
      - { value: 'No, secrets are immutable; create a new secret instead', correct: true }
      - { value: 'Only if no services are using it', correct: false }
      - { value: 'Only manager nodes can update secrets', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 7d4a2f9e-8c1b-4e3a-6f9c-3d7a2e8b5f1c
    question: How are secrets encrypted during transit in a Swarm cluster?
    answers:
      - { value: 'They are not encrypted', correct: false }
      - { value: 'Using TLS and the Swarm's internal CA', correct: true }
      - { value: 'Using AES-256 only', correct: false }
      - { value: 'Using external PKI', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 4e2a7f9c-8d1b-5e3a-9f6c-3d7a4e8b2f1c
    question: What command lists all secrets in a Swarm?
    answers:
      - { value: 'docker swarm secrets', correct: false }
      - { value: 'docker secret ls', correct: true }
      - { value: 'docker secrets list', correct: false }
      - { value: 'docker service secrets', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/secret_ls/

  - uuid: 8c2a1f9e-7d3b-5e4a-6f9c-2d8a5e7b3f1c
    question: What is the primary advantage of using Docker secrets over environment variables?
    answers:
      - { value: 'Secrets are faster to access', correct: false }
      - { value: 'Secrets are encrypted at rest and in transit, not visible in docker inspect', correct: true }
      - { value: 'Secrets use less memory', correct: false }
      - { value: 'Secrets can be larger than environment variables', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/

  - uuid: 5f8a9e3c-7d2b-4e1a-6f9c-3d7a5e8b2f4c
    question: How can you create a secret from a file?
    answers:
      - { value: 'docker secret create <name> <file>', correct: true }
      - { value: 'docker secret load <file>', correct: false }
      - { value: 'docker secret import <file>', correct: false }
      - { value: 'docker create --secret-file <file>', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/secret_create/

  - uuid: 9d3a7f2e-8c1b-5e4a-6f9c-2d8a4e7b3f1c
    question: Can you view the content of a secret after it's created?
    answers:
      - { value: 'Yes, using docker secret inspect', correct: false }
      - { value: 'No, the secret content is not retrievable via Docker commands', correct: true }
      - { value: 'Only manager nodes can view secrets', correct: false }
      - { value: 'Only the service owner can view it', correct: false }
    help: https://docs.docker.com/engine/swarm/secrets/
