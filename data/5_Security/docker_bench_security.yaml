questions:
  - uuid: 960050d8-a83b-4702-b50a-ec485747d341
    question: What is Docker Bench for Security?
    answers:
      - { value: 'A container image scanner', correct: false }
      - { value: 'A script that checks Docker configuration against CIS benchmarks', correct: true }
      - { value: 'A firewall for Docker containers', correct: false }
      - { value: 'A tool for encrypting Docker images', correct: false }
    help: https://github.com/docker/docker-bench-security

  - uuid: e3b4328f-81f3-4780-a563-3fd6c1e486a1
    question: What does CIS stand for in the context of Docker security?
    answers:
      - { value: 'Container Image Security', correct: false }
      - { value: 'Center for Internet Security', correct: true }
      - { value: 'Certified Installation Standard', correct: false }
      - { value: 'Container Isolation System', correct: false }
    help: https://www.cisecurity.org/benchmark/docker

  - uuid: 38cfe9a5-57c8-4aa4-a549-f6273838f630
    question: How do you run Docker Bench for Security?
    answers:
      - { value: 'docker run --security-bench', correct: false }
      - { value: 'docker run -it --net host --pid host --userns host --cap-add audit_control ...', correct: true }
      - { value: 'docker bench start', correct: false }
      - { value: 'docker security audit', correct: false }
    help: https://github.com/docker/docker-bench-security

  - uuid: c7fae985-49d2-416a-a8be-c60cad44e57a
