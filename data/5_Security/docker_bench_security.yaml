    answers:
      - { value: 'Only container runtime configuration', correct: false }
      - { value: 'Host configuration, Docker daemon, images, containers, security operations', correct: true }
      - { value: 'Only network security', correct: false }
      - { value: 'Only image scanning', correct: false }
    help: https://www.cisecurity.org/benchmark/docker

