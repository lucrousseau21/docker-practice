    answers:
      - { value: 'Only pass or fail', correct: false }
      - { value: 'PASS, WARN, INFO, and NOTE', correct: true }
      - { value: 'Only critical and non-critical', correct: false }
      - { value: 'Only numerical scores', correct: false }
    help: https://github.com/docker/docker-bench-security

  - uuid: 4b7f2447-c6f8-401e-bd8c-36e54e3cca57
    question: Is Docker Bench for Security an official Docker product?
    answers:
      - { value: 'No, it is a third-party tool', correct: false }
      - { value: 'Yes, it is maintained by Docker', correct: true }
      - { value: 'Only for Docker Enterprise', correct: false }
