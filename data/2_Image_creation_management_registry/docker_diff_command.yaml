questions:
  - uuid: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
    question: What does the `docker diff` command show?
    answers:
      - { value: 'Changes to files and directories in a container filesystem', correct: true }
      - { value: 'Differences between two images', correct: false }
      - { value: 'Changes in resource usage over time', correct: false }
      - { value: 'Differences in network configuration', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
    question: What are the three types of changes shown by `docker diff`?
    answers:
      - { value: 'A (added), D (deleted), C (changed)', correct: true }
      - { value: 'C (created), R (removed), M (modified)', correct: false }
      - { value: 'N (new), U (updated), R (removed)', correct: false }
      - { value: '+ (added), - (removed), * (modified)', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: c3d4e5f6-a7b8-9c0d-1e2f-3a4b5c6d7e8f
    question: What does the 'A' prefix mean in `docker diff` output?
    answers:
      - { value: 'A file or directory was added', correct: true }
      - { value: 'A file was appended to', correct: false }
      - { value: 'A file is accessible', correct: false }
      - { value: 'A file was archived', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f9a
    question: What does the 'D' prefix mean in `docker diff` output?
    answers:
      - { value: 'A file or directory was deleted', correct: true }
      - { value: 'A directory was created', correct: false }
      - { value: 'Data was duplicated', correct: false }
      - { value: 'A file was downloaded', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b
    question: What does the 'C' prefix mean in `docker diff` output?
    answers:
      - { value: 'A file or directory was changed/modified', correct: true }
      - { value: 'A file was copied', correct: false }
      - { value: 'A file was created', correct: false }
      - { value: 'A file was cached', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: f6a7b8c9-d0e1-2f3a-4b5c-6d7e8f9a0b1c
    question: Can `docker diff` show changes in a stopped container?
    answers:
      - { value: 'Yes, it works on both running and stopped containers', correct: true }
      - { value: 'No, the container must be running', correct: false }
      - { value: 'Only if stopped within the last hour', correct: false }
      - { value: 'Only with the --stopped flag', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: a7b8c9d0-e1f2-3a4b-5c6d-7e8f9a0b1c2d
    question: What is `docker diff` comparing against?
    answers:
      - { value: 'The original image filesystem', correct: true }
      - { value: 'The previous state of the container', correct: false }
      - { value: 'The host filesystem', correct: false }
      - { value: 'Other containers from the same image', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: b8c9d0e1-f2a3-4b5c-6d7e-8f9a0b1c2d3e
    question: Does `docker diff` show changes to mounted volumes?
    answers:
      - { value: 'No, only changes to the container writable layer', correct: true }
      - { value: 'Yes, it shows all filesystem changes', correct: false }
      - { value: 'Only for bind mounts, not named volumes', correct: false }
      - { value: 'Only with the --volumes flag', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: c9d0e1f2-a3b4-5c6d-7e8f-9a0b1c2d3e4f
    question: When would you use `docker diff`?
    answers:
      - { value: 'To debug what changed in a container or before committing changes', correct: true }
      - { value: 'To compare two different images', correct: false }
      - { value: 'To check differences between containers in a service', correct: false }
      - { value: 'To view configuration differences', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: d0e1f2a3-b4c5-6d7e-8f9a-0b1c2d3e4f5a
    question: How does `docker diff` relate to image layers?
    answers:
      - { value: 'It shows changes in the writable layer on top of image layers', correct: true }
      - { value: 'It shows differences between image layers', correct: false }
      - { value: 'It compares layers across images', correct: false }
      - { value: 'It has no relation to image layers', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: e1f2a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
    question: Can `docker diff` show the content of changed files?
    answers:
      - { value: 'No, it only shows which files changed, not the content', correct: true }
      - { value: 'Yes, it shows a line-by-line diff', correct: false }
      - { value: 'Only for text files', correct: false }
      - { value: 'Yes, with the --content flag', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: f2a3b4c5-d6e7-8f9a-0b1c-2d3e4f5a6b7c
    question: What is the relationship between `docker diff` and `docker commit`?
    answers:
      - { value: 'docker diff shows changes that would be captured by docker commit', correct: true }
      - { value: 'docker diff must be run before docker commit', correct: false }
      - { value: 'docker commit automatically runs docker diff', correct: false }
      - { value: 'They are unrelated commands', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: a3b4c5d6-e7f8-9a0b-1c2d-3e4f5a6b7c8d
    question: If a file is modified, does `docker diff` show it as 'C' or 'D' and 'A'?
    answers:
      - { value: 'As C (changed)', correct: true }
      - { value: 'As both D and A', correct: false }
      - { value: 'As M (modified)', correct: false }
      - { value: 'Depends on the change type', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: b4c5d6e7-f8a9-0b1c-2d3e-4f5a6b7c8d9e
    question: Does `docker diff` require the container to be committed first?
    answers:
      - { value: 'No, it can show differences before committing', correct: true }
      - { value: 'Yes, changes must be committed first', correct: false }
      - { value: 'Only for stopped containers', correct: false }
      - { value: 'Depends on the storage driver', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/

  - uuid: c5d6e7f8-a9b0-1c2d-3e4f-5a6b7c8d9e0f
    question: What output format does `docker diff` use?
    answers:
      - { value: 'Plain text list with change type prefix and file path', correct: true }
      - { value: 'JSON format by default', correct: false }
      - { value: 'Unified diff format like git diff', correct: false }
      - { value: 'YAML format', correct: false }
    help: https://docs.docker.com/reference/cli/docker/container/diff/
