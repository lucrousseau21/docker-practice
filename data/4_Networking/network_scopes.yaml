questions:
  - uuid: 6dd95383-aa38-4025-b06c-f40351bdfa37
    question: What are the three network scopes in Docker?
    answers:
      - { value: 'public, private, internal', correct: false }
      - { value: 'local, swarm, global', correct: true }
      - { value: 'host, bridge, overlay', correct: false }
      - { value: 'single, multi, cluster', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_create/

  - uuid: 5dc10b9f-e85e-4d70-9acc-ad2b25934a7d
    question: What does the 'local' network scope mean?
    answers:
      - { value: 'The network spans all nodes in the cluster', correct: false }
      - { value: 'The network is limited to a single host', correct: true }
      - { value: 'The network is accessible only to privileged containers', correct: false }
      - { value: 'The network has no external access', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_create/

  - uuid: 474ef73e-6e20-4ce8-a874-ae035f2001ab
    question: Which network drivers typically have a 'local' scope?
    answers:
      - { value: 'overlay', correct: false }
      - { value: 'bridge, host, none', correct: true }
      - { value: 'macvlan only', correct: false }
      - { value: 'All network drivers', correct: false }
    help: https://docs.docker.com/network/drivers/

  - uuid: 172ec5ae-6de7-4593-918a-016b60103bfb
    question: What does the 'swarm' network scope indicate?
    answers:
      - { value: 'The network is isolated to a single container', correct: false }
      - { value: 'The network spans across all nodes in a Swarm cluster', correct: true }
      - { value: 'The network requires manual configuration', correct: false }
      - { value: 'The network uses NAT', correct: false }
    help: https://docs.docker.com/engine/swarm/networking/

  - uuid: f13bc25b-b3a2-4aff-be7a-1693ef9d5a34
    question: Which network driver typically has a 'swarm' scope?
    answers:
      - { value: 'bridge', correct: false }
      - { value: 'host', correct: false }
      - { value: 'overlay', correct: true }
      - { value: 'none', correct: false }
    help: https://docs.docker.com/engine/swarm/networking/

  - uuid: f74374b7-8d92-47a3-bfff-3c12a4e39fd5
    question: What is the purpose of the 'global' network scope?
    answers:
      - { value: 'For networks accessible from the internet', correct: false }
      - { value: 'For networks created by plugins that manage their own distribution', correct: true }
      - { value: 'For networks that span multiple Swarm clusters', correct: false }
      - { value: 'For public Docker registries', correct: false }
    help: https://docs.docker.com/engine/extend/plugins_network/

  - uuid: 0cd206af-bfe6-4983-ba23-e1e2c71a0c9e
    question: Can you manually specify a scope when creating a network?
    answers:
      - { value: 'Yes, using the --scope flag', correct: false }
      - { value: 'No, the scope is determined by the network driver', correct: true }
      - { value: 'Only for overlay networks', correct: false }
      - { value: 'Only in Swarm mode', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_create/

  - uuid: af0ae088-4938-4135-b63c-6ed93467dc86
    question: How can you view the scope of a network?
    answers:
      - { value: 'docker network ls shows the Scope column', correct: true }
      - { value: 'docker scope <network>', correct: false }
      - { value: 'docker network show --scope', correct: false }
      - { value: 'Scope is not visible to users', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_ls/

  - uuid: a46cae3b-7033-444e-825b-9f4710740241
    question: What happens when you try to create an overlay network outside of Swarm mode?
    answers:
      - { value: 'The network is created with local scope', correct: false }
      - { value: 'Docker returns an error unless you use specific flags', correct: true }
      - { value: 'The network is automatically promoted when Swarm is initialized', correct: false }
      - { value: 'Overlay networks work the same outside Swarm', correct: false }
    help: https://docs.docker.com/network/drivers/overlay/

  - uuid: 636226f3-efd2-4622-aa1a-c973c9c71a0c
    question: Can services on different Swarm clusters communicate via networks with the same name?
    answers:
      - { value: 'Yes, if the networks have the same name', correct: false }
      - { value: 'No, swarm-scoped networks are isolated to their cluster', correct: true }
      - { value: 'Only if both use overlay networks', correct: false }
      - { value: 'Only with VPN configuration', correct: false }
    help: https://docs.docker.com/engine/swarm/networking/
