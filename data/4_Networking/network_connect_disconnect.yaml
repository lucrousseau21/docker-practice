questions:
  - uuid: 8f3a9e7c-4d2b-5e1a-9f6c-3d8a7e2b4f1c
    question: Which command connects a running container to an existing network?
    answers:
      - { value: 'docker attach <container> <network>', correct: false }
      - { value: 'docker network connect <network> <container>', correct: true }
      - { value: 'docker connect <network> <container>', correct: false }
      - { value: 'docker container connect <network>', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_connect/

  - uuid: 2e7f4a9c-8d1b-5e3a-6f9c-4d7a3e8b2f1c
    question: Can a container be connected to multiple networks simultaneously?
    answers:
      - { value: 'No, only one network per container', correct: false }
      - { value: 'Yes, using multiple docker network connect commands', correct: true }
      - { value: 'Only in Swarm mode', correct: false }
      - { value: 'Only user-defined bridge networks', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_connect/

  - uuid: 5c8a4f9e-7d2b-1e3a-6f9c-3d7a5e8b2f4c
    question: Which command disconnects a container from a network?
    answers:
      - { value: 'docker network remove <network> <container>', correct: false }
      - { value: 'docker network disconnect <network> <container>', correct: true }
      - { value: 'docker disconnect <container> <network>', correct: false }
      - { value: 'docker container detach <network>', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_disconnect/

  - uuid: 1d9e7f3a-8c2b-5e4a-9f6c-2d8a4e7b3f1c
    question: What happens to a running container when you disconnect it from its only network?
    answers:
      - { value: 'The container stops running', correct: false }
      - { value: 'The container loses network connectivity but continues running', correct: true }
      - { value: 'Docker automatically connects it to the default bridge', correct: false }
      - { value: 'Docker returns an error', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_disconnect/

  - uuid: 6f2a9e7c-4d1b-8e3a-5f9c-3d7a2e8b1f4c
    question: Can you specify an IP address when connecting a container to a network?
    answers:
      - { value: 'No, IPs are always assigned automatically', correct: false }
      - { value: 'Yes, using the --ip flag with docker network connect', correct: true }
      - { value: 'Only on overlay networks', correct: false }
      - { value: 'Only on macvlan networks', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_connect/

  - uuid: 9e4f7a2c-8d1b-5e3a-6f9c-4d7a3e8b2f1c
    question: Can you add network aliases when connecting a container to a network?
    answers:
      - { value: 'No, aliases can only be set at container creation', correct: false }
      - { value: 'Yes, using the --alias flag with docker network connect', correct: true }
      - { value: 'Only on user-defined bridge networks', correct: false }
      - { value: 'Only with overlay networks in Swarm', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_connect/

  - uuid: 3c8e4f9a-7d2b-5e1a-9f6c-2d8a5e7b3f4c
    question: What happens if you try to connect a container to a network it's already connected to?
    answers:
      - { value: 'Docker creates a second connection', correct: false }
      - { value: 'Docker returns an error', correct: true }
      - { value: 'Docker silently ignores the command', correct: false }
      - { value: 'Docker replaces the existing connection', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_connect/

  - uuid: 7d2f9a5e-8c1b-4e3a-6f9c-3d7a2e8b5f1c
    question: Can you force disconnect a container from a network?
    answers:
      - { value: 'No, disconnection requires container restart', correct: false }
      - { value: 'Yes, using the --force flag with docker network disconnect', correct: true }
      - { value: 'Only if the container is stopped', correct: false }
      - { value: 'Force disconnect is not supported', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_disconnect/

  - uuid: 4e9a7f2c-8d1b-5e3a-9f6c-3d7a4e8b2f1c
    question: How can you view which networks a container is connected to?
    answers:
      - { value: 'docker network ls', correct: false }
      - { value: 'docker inspect <container>', correct: true }
      - { value: 'docker network show <container>', correct: false }
      - { value: 'docker ps --networks', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/inspect/

  - uuid: 8c3f1a9e-7d2b-5e4a-6f9c-2d8a5e7b3f1c
    question: When would you dynamically connect a container to multiple networks?
    answers:
      - { value: 'When the container needs to communicate with services on different networks', correct: true }
      - { value: 'To increase container performance', correct: false }
      - { value: 'To enable privileged mode', correct: false }
      - { value: 'To reduce memory usage', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/network_connect/
