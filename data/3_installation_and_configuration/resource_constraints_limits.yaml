questions:
  - uuid: a4001d0b-2e4e-49f8-b3cc-a34ae787b8dd
    question: What flag limits the memory a container can use?
    answers:
      - { value: '--memory or -m', correct: true }
      - { value: '--mem-limit', correct: false }
      - { value: '--max-memory', correct: false }
      - { value: '--ram', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: baa3aedd-fcce-4653-b43a-8dc655d0f023
    question: How do you limit a container to 2 CPU cores?
    answers:
      - { value: '--cpus=2', correct: true }
      - { value: '--cpu-cores=2', correct: false }
      - { value: '--cpu-limit=2', correct: false }
      - { value: '--max-cpus=2', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 9ba01fdc-fb49-4447-b072-61f661cc7a88
    question: What does the `--memory-swap` flag control?
    answers:
      - { value: 'Total memory limit including swap (memory + swap)', correct: true }
      - { value: 'Only swap memory, separate from main memory limit', correct: false }
      - { value: 'The swap priority for the container', correct: false }
      - { value: 'Whether swap is enabled or disabled', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: a9fd78d6-befd-4682-99e3-9622f5ca2378
    question: How do you disable swap for a container?
    answers:
      - { value: 'Set --memory-swap equal to --memory', correct: true }
      - { value: 'Use --no-swap flag', correct: false }
      - { value: 'Set --memory-swap to 0', correct: false }
      - { value: 'Use --disable-swap flag', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 416ac97f-0310-41d2-8333-2855d143cdd0
    question: What is the purpose of `--cpu-shares`?
    answers:
      - { value: 'Sets the relative CPU weight for scheduling when CPU is constrained', correct: true }
      - { value: 'Limits absolute CPU usage percentage', correct: false }
      - { value: 'Distributes CPU time equally among containers', correct: false }
      - { value: 'Sets the number of CPU cores to use', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 58ecdf37-c91b-4172-a268-05c69606c692
    question: What is the default value for `--cpu-shares`?
    answers:
      - { value: '1024', correct: true }
      - { value: '100', correct: false }
      - { value: '512', correct: false }
      - { value: '0 (unlimited)', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 37cd1936-a6f9-4494-a39a-a264955f1cc0
    question: What happens when a container exceeds its memory limit?
    answers:
      - { value: 'The kernel OOM killer terminates processes in the container', correct: true }
      - { value: 'The container is automatically paused', correct: false }
      - { value: 'Docker swaps the excess to disk', correct: false }
      - { value: 'The memory limit is automatically increased', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 5db2e670-0227-4916-a23d-56543fe5fed0
    question: How do you reserve a minimum amount of memory for a container?
    answers:
      - { value: '--memory-reservation', correct: true }
      - { value: '--memory-min', correct: false }
      - { value: '--min-memory', correct: false }
      - { value: '--memory-guarantee', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: ae36a35b-4b91-4a01-834a-b9e94f5392b2
    question: What does `--cpus=0.5` mean?
    answers:
      - { value: 'The container can use at most 50% of one CPU core', correct: true }
      - { value: 'The container gets half the CPU priority', correct: false }
      - { value: 'The container can use half of all available CPUs', correct: false }
      - { value: 'Invalid syntax, must be integer', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 11025164-c2ac-4054-ad4f-48009c93fc35
    question: How can you limit which CPU cores a container can use?
    answers:
      - { value: '--cpuset-cpus', correct: true }
      - { value: '--cpu-cores', correct: false }
      - { value: '--cpu-affinity', correct: false }
      - { value: '--cpu-pin', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 2dec2057-1f25-4c41-8441-eb3b41d5cdb8
    question: What is the `--pids-limit` flag used for?
    answers:
      - { value: 'Limits the number of processes/threads the container can create', correct: true }
      - { value: 'Limits the number of child containers', correct: false }
      - { value: 'Sets the process priority', correct: false }
      - { value: 'Limits the number of connections', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 279b2486-b91f-4667-bc6a-b5418f3b642f
    question: How do you set a block I/O weight for a container?
    answers:
      - { value: '--blkio-weight (value between 10-1000)', correct: true }
      - { value: '--io-weight', correct: false }
      - { value: '--disk-priority', correct: false }
      - { value: '--io-priority', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: a8928262-19d6-4dc0-a169-92dfa0ef089a
    question: What flag limits the read rate from a specific device?
    answers:
      - { value: '--device-read-bps', correct: true }
      - { value: '--read-limit', correct: false }
      - { value: '--io-read-limit', correct: false }
      - { value: '--device-read-limit', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: a6788a3f-1da1-43e2-9ba3-c807535ca297
    question: Can resource limits be set in docker-compose.yml files?
    answers:
      - { value: 'Yes, using the deploy.resources section', correct: true }
      - { value: 'No, only via docker run flags', correct: false }
      - { value: 'Only for Swarm services', correct: false }
      - { value: 'Only with Docker Compose v1', correct: false }
    help: https://docs.docker.com/compose/compose-file/deploy/

  - uuid: 9e41438a-8e3a-47b8-8752-20561f8594fb
    question: What is the default behavior if no memory limit is set?
    answers:
      - { value: 'Container can use all available host memory', correct: true }
      - { value: 'Container is limited to 1GB by default', correct: false }
      - { value: 'Container is limited to 50% of host memory', correct: false }
      - { value: 'Container gets a proportional share based on number of containers', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/

  - uuid: 6ec3cd22-018d-4d97-b5bf-de87f6e6fd32
    question: How do you set both a soft and hard memory limit for better OOM handling?
    answers:
      - { value: 'Use both --memory-reservation (soft) and --memory (hard)', correct: true }
      - { value: 'Use --memory-soft and --memory-hard', correct: false }
      - { value: 'Use --memory-min and --memory-max', correct: false }
      - { value: 'Only hard limits are supported', correct: false }
    help: https://docs.docker.com/config/containers/resource_constraints/
