  - uuid: 01219e91-a0ec-4b23-80c5-43ff14e21b37
    question: How do you set options when installing a plugin?
    answers:
      - { value: 'docker plugin install <plugin> --grant-all-permissions KEY=VALUE', correct: true }
      - { value: 'docker plugin install <plugin> --options KEY=VALUE', correct: false }
      - { value: 'docker plugin install <plugin> --set KEY=VALUE', correct: false }
      - { value: 'Options can only be set after installation', correct: false }
    help: https://docs.docker.com/reference/cli/docker/plugin/install/
