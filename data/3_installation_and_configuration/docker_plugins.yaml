questions:
  - uuid: 43b3851b-8978-45da-92ad-f592146c681f
    question: What are Docker plugins used for?
    answers:
      - { value: 'To extend Docker functionality with additional drivers and services', correct: true }
      - { value: 'To add commands to the Docker CLI', correct: false }
      - { value: 'To enhance container security only', correct: false }
      - { value: 'To manage Docker daemon configuration', correct: false }
    help: https://docs.docker.com/engine/extend/

  - uuid: 12b6099c-c506-44ce-8370-fa084a141bf0
    question: What types of plugins does Docker support?
    answers:
      - { value: 'Volume, network, authorization, logging, and IPAM plugins', correct: true }
      - { value: 'Only volume and network plugins', correct: false }
      - { value: 'Storage, compute, and security plugins', correct: false }
      - { value: 'CLI, daemon, and runtime plugins', correct: false }
    help: https://docs.docker.com/engine/extend/

  - uuid: 288378eb-3baa-4fd6-bf27-d9dd88527282
    question: How do you install a Docker plugin?
    answers:
      - { value: 'docker plugin install <plugin-name>', correct: true }
      - { value: 'docker install plugin <plugin-name>', correct: false }
      - { value: 'docker add plugin <plugin-name>', correct: false }
      - { value: 'docker plugin add <plugin-name>', correct: false }
    help: https://docs.docker.com/reference/cli/docker/plugin/install/

  - uuid: b40fc2d8-938d-4941-b1a9-d2d9830218a4
    question: How do you list all installed Docker plugins?
    answers:
      - { value: 'docker plugin ls', correct: true }
      - { value: 'docker plugins', correct: false }
      - { value: 'docker plugin list', correct: false }
      - { value: 'docker list plugins', correct: false }
    help: https://docs.docker.com/reference/cli/docker/plugin/ls/

  - uuid: 2acc05b7-eb2c-4593-ad84-a05c1b25451b
    question: What is the state of a plugin after installation but before enabling?
    answers:
      - { value: 'Disabled', correct: true }
      - { value: 'Installed', correct: false }
      - { value: 'Inactive', correct: false }
      - { value: 'Pending', correct: false }
