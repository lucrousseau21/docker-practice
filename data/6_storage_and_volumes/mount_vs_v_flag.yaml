questions:
  - uuid: 7e8a9f3c-2d1b-5e4a-6f9c-3d7a2e8b4f1c
    question: What is the main difference between the -v and --mount syntax?
    answers:
      - { value: 'They are completely different commands', correct: false }
      - { value: '--mount is more explicit and verbose; -v is more concise', correct: true }
      - { value: '-v is deprecated', correct: false }
      - { value: '--mount only works in Swarm', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 2e4a8f9c-7d1b-5e3a-9f6c-4d7a3e8b2f1c
    question: Which flag is recommended for new users according to Docker documentation?
    answers:
      - { value: '-v flag', correct: false }
      - { value: '--mount flag', correct: true }
      - { value: 'Both are equally recommended', correct: false }
      - { value: 'Neither, use Dockerfile VOLUME', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 5c9a8e4f-7d2b-1e3a-6f9c-3d8a5e7b2f4c
    question: How do you create a named volume using the -v syntax?
    answers:
      - { value: 'docker run -v myvolume:/data ...', correct: true }
      - { value: 'docker run -v name=myvolume:/data ...', correct: false }
      - { value: 'docker run -v /data:myvolume ...', correct: false }
      - { value: 'docker run --volume myvolume /data ...', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 1d7a4f9e-8c2b-5e3a-9f6c-2d8a4e7b3f1c
    question: How do you create a named volume using the --mount syntax?
    answers:
      - { value: '--mount myvolume:/data', correct: false }
      - { value: '--mount type=volume,source=myvolume,target=/data', correct: true }
      - { value: '--mount volume=myvolume,path=/data', correct: false }
      - { value: '--mount name=myvolume,destination=/data', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 6f3a2e9c-7d1b-4e8a-5f9c-3d7a2e8b1f4c
    question: How do you create a bind mount using the -v syntax?
    answers:
      - { value: 'docker run -v /host/path:/container/path ...', correct: true }
      - { value: 'docker run -v bind:/host/path:/container/path ...', correct: false }
      - { value: 'docker run -v /container/path:/host/path ...', correct: false }
      - { value: 'docker run --bind /host/path:/container/path ...', correct: false }
    help: https://docs.docker.com/storage/bind-mounts/

  - uuid: 9e8a7f4c-8d1b-5e3a-6f9c-4d7a3e8b2f1c
    question: How do you create a bind mount using the --mount syntax?
    answers:
      - { value: '--mount /host/path:/container/path', correct: false }
      - { value: '--mount type=bind,source=/host/path,target=/container/path', correct: true }
      - { value: '--mount bind=/host/path,to=/container/path', correct: false }
      - { value: '--mount mode=bind,src=/host/path,dst=/container/path', correct: false }
    help: https://docs.docker.com/storage/bind-mounts/

  - uuid: 3c4a9e8f-7d2b-5e1a-9f6c-2d8a5e7b3f4c
    question: What happens with -v if the volume does not exist?
    answers:
      - { value: 'Docker returns an error', correct: false }
      - { value: 'Docker automatically creates the volume', correct: true }
      - { value: 'Docker creates a bind mount instead', correct: false }
      - { value: 'Docker asks for user confirmation', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 7d4a2f9e-8c1b-4e3a-6f9c-3d7a2e8b5f1c
    question: How do you make a volume read-only with -v?
    answers:
      - { value: 'docker run -v myvolume:/data:ro ...', correct: true }
      - { value: 'docker run -v myvolume:/data:readonly ...', correct: false }
      - { value: 'docker run -v myvolume:/data --read-only ...', correct: false }
      - { value: 'Volumes cannot be read-only', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 4e2a7f9c-8d1b-5e3a-9f6c-3d7a4e8b2f1c
    question: How do you make a volume read-only with --mount?
    answers:
      - { value: '--mount type=volume,source=myvolume,target=/data,ro', correct: false }
      - { value: '--mount type=volume,source=myvolume,target=/data,readonly', correct: true }
      - { value: '--mount type=volume,source=myvolume,target=/data:ro', correct: false }
      - { value: '--mount type=volume,source=myvolume,target=/data,mode=ro', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 8c2a1f9e-7d3b-5e4a-6f9c-2d8a5e7b3f1c
    question: Which syntax provides better error messages when there are configuration issues?
    answers:
      - { value: '-v syntax', correct: false }
      - { value: '--mount syntax', correct: true }
      - { value: 'Both provide the same errors', correct: false }
      - { value: 'Neither provides errors', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 5f8a9e3c-7d2b-4e1a-6f9c-3d7a5e8b2f4c
    question: Can you use -v and --mount in the same docker run command?
    answers:
      - { value: 'No, only one is allowed', correct: false }
      - { value: 'Yes, you can use both', correct: true }
      - { value: 'Only in Swarm mode', correct: false }
      - { value: 'Only with bind mounts', correct: false }
    help: https://docs.docker.com/storage/volumes/

  - uuid: 9d3a7f2e-8c1b-5e4a-6f9c-2d8a4e7b3f1c
    question: Which syntax is required for Docker Swarm services?
    answers:
      - { value: '-v flag', correct: false }
      - { value: '--mount flag', correct: true }
      - { value: 'Both work in Swarm', correct: false }
      - { value: 'Volumes are not supported in Swarm', correct: false }
    help: https://docs.docker.com/engine/reference/commandline/service_create/
